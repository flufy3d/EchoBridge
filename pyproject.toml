[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echobridge"
version = "0.1.0"
description = "Self-hosted Doubao-compatible realtime voice gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]
# In-process ASR/TTS backends.  Installing this extra is optional: the gateway
# keeps working with ECHOBRIDGE_ASR_BACKEND=qwen3 and TTS_BACKEND=vllm without
# qwen-asr/qwen-tts in the main venv.  Install with --no-deps first if the
# resolver tries to replace the CUDA torch build.
inprocess = [
  "qwen-asr==0.0.6",
  "qwen-tts==0.1.1",
  "transformers==4.57.6",
  "accelerate>=1.0",
  "librosa",
  "soundfile",
  "soynlp",
  "nagisa",
  "qwen-omni-utils",
  "einops",
  "sox",
]

[project.scripts]
echobridge = "echobridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echobridge = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
